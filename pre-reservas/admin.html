<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pré-reservas | Lippi & Léo</title><style>
*{box-sizing:border-box}body{background:#130d11;color:#fff;font:16px system-ui,Arial;margin:0;padding:24px}main{max-width:900px;margin:auto}h1{font-size:25px}input,button{font:inherit;padding:12px;border-radius:8px;border:1px solid #745861}input{background:white;color:#111;width:100%;margin:5px 0 14px}button{background:#9b2843;color:white;cursor:pointer}button:disabled{opacity:.5}article{padding:16px;margin:14px 0;border:1px solid #745861;border-radius:12px;background:#21141c}article p{margin:8px 0}article button{margin:8px 8px 0 0}.muted{color:#cbbbc1}#app[hidden],#login[hidden]{display:none}</style></head><body><main><h1>Solicitações de shows — Lippi & Léo</h1><p class="muted">Área exclusiva de administradores autorizados.</p>
<section id="login"><h2>Entrar</h2><form id="auth"><label>E-mail cadastrado no painel<input type="email" id="email" autocomplete="username" required></label><label>Senha<input type="password" id="password" autocomplete="current-password" required></label><button>Entrar</button></form></section>
<section id="app" hidden><button id="refresh">Atualizar pedidos</button> <button id="logout">Sair</button><div id="requests"></div></section><p id="notice" role="status"></p></main>
<script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2.49.10";
const supabase=createClient("https://zcfudytghjsosnpkmgzv.supabase.co","sb_publishable_2ALYNwAtD2DtRHN66Q055w__tpP-oid");
const API="https://zcfudytghjsosnpkmgzv.supabase.co/functions/v1/pre-reservas";
const notice=document.getElementById("notice"),login=document.getElementById("login"),app=document.getElementById("app"),list=document.getElementById("requests");
const say=t=>notice.textContent=t;
async function call(body){const {data:{session}}=await supabase.auth.getSession();if(!session)throw Error("Entre com sua conta.");const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+session.access_token},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||"Falha ao consultar");return d}
function p(parent,label,value){const el=document.createElement("p"),b=document.createElement("strong");b.textContent=label+": ";el.append(b,document.createTextNode(String(value||"—")));parent.append(el)}
async function load(){say("Carregando pedidos...");try{const data=await call({action:"list"});login.hidden=true;app.hidden=false;list.replaceChildren();if(!data.requests.length){list.textContent="Nenhuma solicitação recebida."}for(const item of data.requests){const card=document.createElement("article");p(card,"Status",item.status);p(card,"Data",item.data_show);p(card,"Horário",String(item.horario_inicio).slice(0,5)+" (3 horas)");p(card,"Contratante",item.contratante_nome);p(card,"Cidade",item.cidade);p(card,"Local",item.local_evento);p(card,"WhatsApp",item.whatsapp);if(item.status==="pendente"){for(const [value,label] of [["aprovado","Aprovar"],["recusado","Recusar"]]){const btn=document.createElement("button");btn.textContent=label;btn.onclick=async()=>{if(!confirm(label+" este pedido?"))return;btn.disabled=true;try{await call({action:"decision",id:item.id,status:value});await load()}catch(e){say(e.message);btn.disabled=false}};card.append(btn)}}list.append(card)}say("")}catch(e){say(e.message)}}
document.getElementById("auth").onsubmit=async e=>{e.preventDefault();say("Entrando...");const {error}=await supabase.auth.signInWithPassword({email:document.getElementById("email").value,password:document.getElementById("password").value});if(error){say("Não foi possível entrar: "+error.message);return}await load()};
document.getElementById("refresh").onclick=load;document.getElementById("logout").onclick=async()=>{await supabase.auth.signOut();app.hidden=true;login.hidden=false;say("Sessão encerrada")};
if((await supabase.auth.getSession()).data.session)await load();
</script></body></html>
