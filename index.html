const SHOWS_URL='https://raw.githubusercontent.com/lippieleo/site-lippi-e-leo/main/agenda/shows.json';
let current=new Date();current.setDate(1);
let shows=[];const cal=document.getElementById('calendar'),heading=document.getElementById('month');
function dateKey(y,m,d){return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0')}
function draw(){
cal.replaceChildren();heading.textContent=new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric'}).format(current);
['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].forEach(t=>{const e=document.createElement('div');e.className='dayname';e.textContent=t;cal.append(e)});
const y=current.getFullYear(),m=current.getMonth(),offset=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
for(let i=0;i<offset;i++){const e=document.createElement('div');e.className='day empty';cal.append(e)}
for(let d=1;d<=days;d++){
const e=document.createElement('div');e.className='day',n=document.createElement('span');n.className='num';n.textContent=d;e.append(n);
const daily=shows.filter(x=>x.date===dateKey(y,m,d));
if(daily.length){e.classList.add('has-show');const item=document.createElement('button');item.type='button';item.className='show-entry show-city-button';item.textContent=daily.length===1?(daily[0].city||'Show'):((daily[0].city||'Show')+' +'+(daily.length-1));item.title='Clique para ver os detalhes do show';item.setAttribute('aria-label','Ver shows de '+d+'/'+(m+1)+'/'+y);item.addEventListener('click',()=>openShowDetails(daily,d,m,y));e.append(item)}
cal.append(e)
}
/* Completa sempre 6 semanas (42 casas), independentemente do mes. */
while(cal.children.length<49){const e=document.createElement('div');e.className='day empty';cal.append(e)}
}
const modal=document.createElement('div');modal.id='show-modal';modal.className='show-modal';modal.hidden=true;modal.innerHTML='<div class="show-modal-backdrop"></div><section class="show-modal-panel" role="dialog" aria-modal="true" aria-labelledby="show-modal-title"><button class="show-modal-close" type="button" aria-label="Fechar informações">×</button><h3 id="show-modal-title">Informações do show</h3><div id="show-modal-content"></div></section>';document.body.append(modal);
const closeButton=modal.querySelector('.show-modal-close');const backdrop=modal.querySelector('.show-modal-backdrop');let previousFocus=null;
function closeShowDetails(){modal.hidden=true;document.body.classList.remove('modal-open');if(previousFocus)previousFocus.focus()}
closeButton.addEventListener('click',closeShowDetails);backdrop.addEventListener('click',closeShowDetails);
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!modal.hidden)closeShowDetails()});
function openShowDetails(daily,d,m,y){previousFocus=document.activeElement;const content=document.getElementById('show-modal-content');content.replaceChildren();const title=document.getElementById('show-modal-title');title.textContent='Shows de '+String(d).padStart(2,'0')+'/'+String(m+1).padStart(2,'0')+'/'+y;daily.forEach(show=>{const section=document.createElement('div');section.className='show-modal-event';const city=document.createElement('h4');city.textContent=show.city||'Show';section.append(city);[['Local',show.venue],['Horário',show.time]].forEach(([label,value])=>{if(value){const p=document.createElement('p');const strong=document.createElement('strong');strong.textContent=label+': ';p.append(strong,document.createTextNode(value));section.append(p)}});content.append(section)});modal.hidden=false;document.body.classList.add('modal-open');closeButton.focus()}
document.getElementById('prev').onclick=()=>{current.setMonth(current.getMonth()-1);draw()};
document.getElementById('next').onclick=()=>{current.setMonth(current.getMonth()+1);draw()};
async function syncShows(){
try{const response=await fetch(SHOWS_URL+'?v='+Date.now(),{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);const data=await response.json();if(!Array.isArray(data))throw new Error('Formato inesperado');shows=data.filter(x=>x&&/^\d{4}-\d{2}-\d{2}$/.test(x.date)).map(x=>({date:x.date,city:String(x.city||''),venue:String(x.venue||''),time:String(x.time||'')}));draw()}catch(err){console.warn('Não foi possível carregar os shows neste momento.');console.error('Erro ao sincronizar agenda:',err)}
}
draw();syncShows();setInterval(syncShows,5*60*1000);
</script><script>
/* Remove o fundo preto da logomarca ORIGINAL sem redesenhar as letras. */
(function(){
const logo=document.querySelector('header > img[alt="Logomarca oficial Lippi & Léo"]');
if(!logo)return;
function removeBlackBackground(){
try{
const canvas=document.createElement('canvas');canvas.width=logo.naturalWidth;canvas.height=logo.naturalHeight;
if(!canvas.width||!canvas.height)return;
const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(logo,0,0);
const frame=ctx.getImageData(0,0,canvas.width,canvas.height),p=frame.data;
for(let i=0;i<p.length;i+=4){
const brightness=Math.max(p[i],p[i+1],p[i+2]);
const a=Math.max(0,Math.min(1,(brightness-5)/245));
if(a<=0){p[i]=p[i+1]=p[i+2]=p[i+3]=0;continue}
p[i]=Math.min(255,Math.round(p[i]/a));
p[i+1]=Math.min(255,Math.round(p[i+1]/a));
p[i+2]=Math.min(255,Math.round(p[i+2]/a));
p[i+3]=Math.round(a*255);
}
ctx.putImageData(frame,0,0);
logo.src=canvas.toDataURL('image/png');logo.style.mixBlendMode='normal';logo.style.background='transparent';
}catch(err){console.warn('Não foi possível preparar a transparência da logomarca',err)}
}
if(logo.complete&&logo.naturalWidth)removeBlackBackground();
else logo.addEventListener('load',removeBlackBackground,{once:true});
})();
</script><script>

const frame=ctx.getImageData(0,0,w,h),data=frame.data;
const visited=new Uint8Array(w*h),queue=new Int32Array(w*h);let head=0,tail=0;

const k=idx*4,r=data[k],g=data[k+1],b=data[k+2];
const mx=Math.max(r,g,b),mn=Math.min(r,g,b);
return mx-mn<22&&mx>90&&mx<250;
}
function add(idx){if(!visited[idx]&&eligible(idx)){visited[idx]=1;queue[tail++]=idx}}
for(let x=0;x<w;x++){add(x);add((h-1)*w+x)}
for(let y=0;y<h;y++){add(y*w);add(y*w+w-1)}
while(head<tail){
const i=queue[head++],x=i%w,y=(i/w)|0;
if(x>0)add(i-1);if(x<w-1)add(i+1);
if(y>0)add(i-w);if(y<h-1)add(i+w);
}
for(let i=0;i<tail;i++){data[queue[i]*4+3]=0}
ctx.putImageData(frame,0,0);
/* Apaga somente o fio solto que sai da lateral esquerda da barba do Lippi.
   Coordenadas relativas a foto original; nao modifica rosto nem cores. */
ctx.save();
ctx.globalCompositeOperation='destination-out';
ctx.beginPath();
ctx.moveTo(w*0.184,h*0.282);
ctx.lineTo(w*0.230,h*0.304);
ctx.lineTo(w*0.245,h*0.330);
ctx.lineTo(w*0.215,h*0.321);
ctx.lineTo(w*0.181,h*0.300);
ctx.closePath();
ctx.fill();
ctx.restore();
photo.src=canvas.toDataURL('image/png');
photo.style.mixBlendMode='normal';photo.style.filter='none';photo.style.background='transparent';
}catch(e){console.warn('Não foi possível remover o fundo da foto',e)}
}
if(photo.complete&&photo.naturalWidth)removeCheckerboard();
else photo.addEventListener('load',removeCheckerboard,{once:true});
})();
