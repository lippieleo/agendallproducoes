let current=new Date();current.setDate(1);const cal=document.getElementById('calendar'),heading=document.getElementById('month');function draw(){cal.replaceChildren();heading.textContent=new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric'}).format(current);['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].forEach(s=>{const e=document.createElement('div');e.className='dayname';e.textContent=s;cal.append(e)});const offset=new Date(current.getFullYear(),current.getMonth(),1).getDay(),days=new Date(current.getFullYear(),current.getMonth()+1,0).getDate();for(let i=0;i<offset;i++){const e=document.createElement('div');e.className='day empty';cal.append(e)}for(let d=1;d<=days;d++){const e=document.createElement('div');e.className='day';const n=document.createElement('span');n.className='num';n.textContent=d;e.append(n);cal.append(e)}}document.getElementById('prev').onclick=()=>{current.setMonth(current.getMonth()-1);draw()};document.getElementById('next').onclick=()=>{current.setMonth(current.getMonth()+1);draw()};draw();
