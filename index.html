<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LL Produções | Agenda Online</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b0b0e;color:#fff;font:16px system-ui,Arial}header{background:linear-gradient(125deg,#17171c,#380b12);padding:24px 5%;border-bottom:2px solid #b91c1c}h1{margin:0;font-size:clamp(24px,5vw,40px);letter-spacing:2px}header p{color:#fca5a5;margin:6px 0}main{max-width:1000px;margin:auto;padding:24px 16px}.notice{border:1px solid #783636;border-radius:12px;padding:14px;background:#251317;color:#fecaca;margin-bottom:20px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.toolbar button{background:#26262e;color:white;border:1px solid #444;border-radius:8px;padding:10px 15px;cursor:pointer}h2{font-size:22px;text-align:center}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.dayname{text-align:center;color:#bbb;font-size:12px;padding:8px 0}.day{min-height:85px;background:#1b1b21;border:1px solid #32323b;border-radius:8px;padding:8px;overflow:hidden}.day.empty{background:transparent;border:0}.num{font-weight:700;color:#ddd}.event{display:block;margin-top:5px;padding:5px;border-radius:5px;background:#9f1724;color:#fff;font-size:12px;overflow-wrap:anywhere}footer{color:#999;text-align:center;padding:25px;font-size:12px}@media(max-width:600px){.day{min-height:62px;padding:4px}.event{font-size:10px;padding:3px}.num{font-size:12px}}</style></head><body><header><h1>LL PRODUÇÕES</h1><p>AGENDA ONLINE • EQUIPE</p></header><main><div class="notice"><strong>Versão de demonstração.</strong> O acesso privado e o cadastro de shows serão habilitados após a configuração do Supabase. Nenhuma informação real de shows deve ser publicada nesta versão.</div><div class="toolbar"><button id="prev" aria-label="Mês anterior">❮ Anterior</button><h2 id="month"></h2><button id="next" aria-label="Próximo mês">Próximo ❯</button></div><div class="calendar" id="calendar"></div></main><footer>LL Produções • Área da equipe em preparação</footer><script>
let current=new Date();current.setDate(1);const cal=document.getElementById('calendar'),heading=document.getElementById('month');function draw(){cal.replaceChildren();heading.textContent=new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric'}).format(current);['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].forEach(s=>{const e=document.createElement('div');e.className='dayname';e.textContent=s;cal.append(e)});const offset=new Date(current.getFullYear(),current.getMonth(),1).getDay(),days=new Date(current.getFullYear(),current.getMonth()+1,0).getDate();for(let i=0;i<offset;i++){const e=document.createElement('div');e.className='day empty';cal.append(e)}for(let d=1;d<=days;d++){const e=document.createElement('div');e.className='day';const n=document.createElement('span');n.className='num';n.textContent=d;e.append(n);cal.append(e)}}document.getElementById('prev').onclick=()=>{current.setMonth(current.getMonth()-1);draw()};document.getElementById('next').onclick=()=>{current.setMonth(current.getMonth()+1);draw()};draw();
</script></body></html>
