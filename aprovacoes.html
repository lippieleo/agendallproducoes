<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aprovações | Lippi & Léo</title><style>body{margin:0;background:#130d12;color:#fff;font:16px Arial,sans-serif}main{max-width:680px;margin:35px auto;padding:22px}h1{color:#e7bc72}section,.item{background:#211b23;border:1px solid #69543c;border-radius:14px;padding:18px;margin:16px 0}input{box-sizing:border-box;width:100%;padding:13px;border-radius:8px;border:1px solid #aaa;background:#fff;color:#111;margin:8px 0}button{border:0;border-radius:8px;padding:13px 18px;color:white;font-weight:bold;cursor:pointer;margin:6px 5px 6px 0;background:#846532}.yes{background:#176c44}.no{background:#9d3439}.muted{color:#d0c1bb;font-size:14px}a{color:#e7bc72}.item p{line-height:1.6;white-space:pre-line}#message{min-height:1.5em}</style></head><body><main><h1>Lippi &amp; Léo</h1><h2>Painel de aprovação de shows</h2><p class="muted">Apenas administradores autorizados podem aprovar ou recusar pedidos. Cada show ocupa 3 horas.</p><section id="login"><label>E-mail administrativo</label><input type="email" id="email" placeholder="seuemail@gmail.com" autocomplete="email"><button id="send">Receber código de acesso</button><div id="otpbox" hidden><label>Código recebido no e-mail</label><input id="otp" inputmode="numeric" autocomplete="one-time-code" placeholder="Código de 6 dígitos"><button id="verify">Entrar</button></div></section><section id="panel" hidden><button id="refresh">Atualizar pedidos</button><button id="logout">Sair</button><div id="requests"></div></section><p id="message" role="status"></p><p><a href="./">Voltar à agenda</a></p></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.58.0';
const sb=createClient('https://zcfudytghjsosnpkmgzv.supabase.co','sb_publishable_2ALYNwAtD2DtRHN66Q055w__tpP-oid');
const API='https://zcfudytghjsosnpkmgzv.supabase.co/functions/v1/pre-reservas';
const $=id=>document.getElementById(id),q=new URLSearchParams(location.search);
const message=s=>$('message').textContent=s;
async function token(){const {data}=await sb.auth.getSession();return data.session?.access_token}
async function call(action,body){const jwt=await token();if(!jwt)throw Error('Entre com o e-mail administrativo.');const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+jwt},body:JSON.stringify({action,...body})});const d=await r.json();if(!r.ok)throw Error(d.error||'Falha na operação');return d}
$('send').onclick=async()=>{try{const email=$('email').value.trim();if(!email)throw Error('Informe seu e-mail.');const {error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:false}});if(error)throw error;$('otpbox').hidden=false;message('Confira seu e-mail. Digite o código recebido.')}catch(e){message(e.message)}};
$('verify').onclick=async()=>{try{const {error}=await sb.auth.verifyOtp({email:$('email').value.trim(),token:$('otp').value.trim(),type:'email'});if(error)throw error;await load()}catch(e){message(e.message)}};
$('refresh').onclick=()=>load();
$('logout').onclick=async()=>{await sb.auth.signOut();$('panel').hidden=true;$('login').hidden=false;message('Você saiu do painel.')};
function node(tag,txt){const el=document.createElement(tag);el.textContent=txt;return el}
async function load(){try{const data=await call('list');$('login').hidden=true;$('panel').hidden=false;const root=$('requests');root.replaceChildren();const pending=(data.requests||[]).filter(x=>x.status==='pendente');if(!pending.length)root.append(node('p','Nenhum pedido pendente.'));for(const x of pending){const item=document.createElement('div');item.className='item';if(q.get('pedido')===x.id)item.style.borderColor='#e7bc72';item.append(node('h3',x.data_show+' às '+String(x.horario_inicio).slice(0,5)));item.append(node('p','Contratante: '+x.contratante_nome+'\nLocal: '+x.local_evento+'\nCidade: '+x.cidade+'\nWhatsApp: '+x.whatsapp));for(const [status,label,cls] of [['aprovado','✓ Aprovar','yes'],['recusado','✕ Recusar','no']]){const btn=node('button',label);btn.className=cls;btn.onclick=async()=>{if(!confirm('Confirma '+(status==='aprovado'?'a APROVAÇÃO':'a RECUSA')+' do show em '+x.data_show+' às '+x.horario_inicio+'?'))return;btn.disabled=true;try{await call('decision',{id:x.id,status});message('Decisão registrada com sucesso.');await load()}catch(e){message(e.message);btn.disabled=false}};item.append(btn)}root.append(item)}const approved=(data.requests||[]).filter(x=>x.status==='aprovado');const title=node('h3','Shows aprovados ('+approved.length+')');root.append(title);if(!approved.length)root.append(node('p','Nenhum show aprovado.'));for(const x of approved){const item=document.createElement('div');item.className='item';item.append(node('h3',x.data_show+' às '+String(x.horario_inicio).slice(0,5)+' — ✓ Aprovado'));item.append(node('p','Contratante: '+x.contratante_nome+'\nLocal: '+x.local_evento+'\nCidade: '+x.cidade));root.append(item)}const selected=q.get('pedido');if(selected&&!pending.some(x=>x.id===selected))message('O pedido do e-mail já foi processado ou não está mais pendente.');else if(selected){const el=[...root.children].find(el=>el.querySelector('h3')&&el.style.borderColor);if(el){el.scrollIntoView({block:'center'});message('Confira os dados e confirme sua decisão.')}}}catch(e){message(e.message);if(!(await token())){$('login').hidden=false;$('panel').hidden=true}}}
sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_IN'&&session)setTimeout(load,0)});
if(await token())await load();
</script></body></html>
